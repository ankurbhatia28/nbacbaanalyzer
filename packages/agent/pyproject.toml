[project]
name = "nbacba-agent"
version = "0.1.0"
description = "The agent layer: tools the model may call, and nothing it may decide alone."
requires-python = ">=3.12"
dependencies = [
    "nbacba-engine",
    "nbacba-data",
    "nbacba-rag",
    "anthropic>=0.40",
    # The OpenRouter fallback's client (D23); already installed by anthropic.
    "httpx2>=2.0",
]

[project.optional-dependencies]
# Tracing is optional: the agent runs, and the whole test suite passes, with
# no observability backend installed. See D16.
langfuse = ["langfuse>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
nbacba-engine = { workspace = true }
nbacba-data = { workspace = true }
nbacba-rag = { workspace = true }
