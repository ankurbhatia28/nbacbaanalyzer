[project]
name = "nbacba-agent"
version = "0.1.0"
description = "The agent layer: tools the model may call, and nothing it may decide alone."
requires-python = ">=3.12"
dependencies = [
    "nbacba-engine",
    "nbacba-data",
    "nbacba-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
nbacba-engine = { workspace = true }
nbacba-data = { workspace = true }
nbacba-rag = { workspace = true }
