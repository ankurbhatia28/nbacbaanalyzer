name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev --extra langfuse

      # A committed .env cannot be un-leaked by a later commit. Fail loudly.
      - name: No secrets tracked
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::env file(s) tracked in git: $leaked"
            exit 1
          fi
          echo "ok: no .env files tracked"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The engine, data and retrieval layers must stay free of LLM
      # dependencies (ADR-001), so their answers are reproducible with no key
      # present. `packages/agent` is the one place a client is allowed.
      # tests/test_architecture.py checks this by parsing imports; this grep is
      # the cheap loud version that runs before the suite.
      - name: Deterministic packages import no LLM client
        run: |
          for pkg in engine data rag; do
            if grep -rEn "import (anthropic|openai)|from (anthropic|openai)" "packages/$pkg/src"; then
              echo "::error::packages/$pkg must not import an LLM client (ADR-001)"
              exit 1
            fi
          done
          echo "ok: engine, data and rag are LLM-free"

      - name: Typecheck
        run: uv run mypy packages/engine/src packages/data/src packages/rag/src packages/agent/src apps/api/src

      # The CBA PDF is not in git (D20). Fetched from an official copy and
      # checked against the sha256 pinned in rag/fetch.py; cached under that
      # file's hash, so changing the pin invalidates the cache. Without it,
      # every test that reads the Agreement skips -- which CI did until 8.1.
      - name: Cache the CBA PDF
        uses: actions/cache@v4
        with:
          path: data/cba/nba-cba-2023.pdf
          key: cba-pdf-${{ hashFiles('packages/rag/src/rag/fetch.py') }}
      - name: Fetch and verify the CBA PDF
        run: uv run python -m rag.fetch

      - name: Tests
        run: uv run pytest

  # The two read-only build artifacts (ADR-004, task 8.1): built from source in
  # CI, never committed, uploaded for the deploy (8.3) to bundle. Only after
  # the suite passes, so an artifact is never built from code that fails it.
  artifacts:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev --extra langfuse
      - name: Cache the CBA PDF
        uses: actions/cache@v4
        with:
          path: data/cba/nba-cba-2023.pdf
          key: cba-pdf-${{ hashFiles('packages/rag/src/rag/fetch.py') }}
      - name: Fetch and verify the CBA PDF
        run: uv run python -m rag.fetch
      - name: Build the league database
        run: uv run python -m nbadata.ingest.load --out build/nbacba.db
      - name: Build the retrieval index
        run: uv run python -m rag --out build/cba-index.db
      - uses: actions/upload-artifact@v4
        with:
          name: nbacba-artifacts
          path: |
            build/nbacba.db
            build/cba-index.db
          if-no-files-found: error
          retention-days: 30

  # The image Render deploys (8.3), built but not pushed: a Dockerfile that
  # breaks should fail here, on the pull request, not on Render after merge.
  # Render deploys only once these checks pass (render.yaml).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t nbacba-api .

  # The engine as published on its own (8.4): built as a wheel, installed into
  # an empty environment, and tested there -- outside the workspace, so a
  # dependency on the rest of the repository cannot hide behind it.
  engine-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Build the wheel
        run: uv build --package nba-cba-engine --out-dir dist
      - name: Install it alone and run its tests
        run: |
          uv venv /tmp/engine -p 3.12
          VIRTUAL_ENV=/tmp/engine uv pip install dist/*.whl pytest hypothesis
          cp -r packages/engine/tests /tmp/engine-tests
          cd /tmp && /tmp/engine/bin/pytest -q -p no:cacheprovider /tmp/engine-tests

  # Blocking as of Phase 4: the suite reports a real pass rate, so a regression
  # in it is a regression in the engine.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev --extra langfuse
      - name: Eval suite
        run: uv run python -m nbadata.evals

  # The web app (Phase 7). Type-checked, unit-tested and built; it never talks
  # to a model or the API here -- the card fixtures stand in for both.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
