name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev

      # A committed .env cannot be un-leaked by a later commit. Fail loudly.
      - name: No secrets tracked
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::env file(s) tracked in git: $leaked"
            exit 1
          fi
          echo "ok: no .env files tracked"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The engine, data and retrieval layers must stay free of LLM
      # dependencies (ADR-001), so their answers are reproducible with no key
      # present. `packages/agent` is the one place a client is allowed.
      # tests/test_architecture.py checks this by parsing imports; this grep is
      # the cheap loud version that runs before the suite.
      - name: Deterministic packages import no LLM client
        run: |
          for pkg in engine data rag; do
            if grep -rEn "import (anthropic|openai)|from (anthropic|openai)" "packages/$pkg/src"; then
              echo "::error::packages/$pkg must not import an LLM client (ADR-001)"
              exit 1
            fi
          done
          echo "ok: engine, data and rag are LLM-free"

      - name: Typecheck
        run: uv run mypy packages/engine/src packages/data/src packages/rag/src packages/agent/src apps/api/src

      - name: Tests
        run: uv run pytest

  # Blocking as of Phase 4: the suite reports a real pass rate, so a regression
  # in it is a regression in the engine.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev
      - name: Eval suite
        run: uv run python -m nbadata.evals
